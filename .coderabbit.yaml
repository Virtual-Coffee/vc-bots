# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit review config for vc-bots. Reference: https://docs.coderabbit.ai/getting-started/yaml-configuration
language: "en-US"

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  poem: false
  suggested_labels: false
  suggested_reviewers: false
  estimate_code_review_effort: false

  auto_review:
    enabled: true
    drafts: false
    # Any target branch, not just main — stacked PRs target their parent layer.
    base_branches:
      - ".*"
    # Opt in per PR: only PRs carrying this label are reviewed automatically.
    labels:
      - "coderabbit-review"

  # Generated / vendored files that add noise, not signal.
  path_filters:
    - "!worker-configuration.d.ts"
    - "!pnpm-lock.yaml"
    - "!node_modules/**"
    - "!.wrangler/**"
    - "!dist/**"
    # `pnpm gen:api-types` output and the vendored provider specs (docs/adr/0012); the two
    # hand-written OAuth fragments in specs/ stay in review.
    - "!src/generated/**"
    - "!specs/google-calendar-v3.openapi.json"
    - "!specs/zoom-meetings.openapi.json"

  pre_merge_checks:
    docstrings:
      mode: off # comments are one-line pointers to ADRs/CONTEXT.md, not doc prose
  finishing_touches:
    docstrings:
      enabled: false

  tools:
    gitleaks:
      enabled: true

chat:
  auto_reply: true

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "CLAUDE.md"
      - "CONTEXT.md"
      - "docs/adr/**/*.md"
      - "docs/agents/**/*.md"
